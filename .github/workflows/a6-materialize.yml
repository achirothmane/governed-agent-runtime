name: Materialize A6

on:
  push:
    branches: [feat/agent-loop-a6]

permissions:
  contents: write

jobs:
  materialize:
    if: "!contains(github.event.head_commit.message, 'Materialize A6')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - name: Format and tidy
        run: |
          gofmt -w agentloop agentserver integration/a6
          go mod tidy
      - name: Commit exact state
        run: |
          rm .github/workflows/a6-materialize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agentloop agentserver integration/a6 go.mod go.sum
          git add -u .github/workflows/a6-materialize.yml
          git commit -m "Materialize A6"
          git push
