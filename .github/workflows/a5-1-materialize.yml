name: Materialize A5.1

on:
  push:
    branches: [feat/temporal-tool-activity-a5-1]

permissions:
  contents: write

jobs:
  materialize:
    if: "!contains(github.event.head_commit.message, 'Materialize A5.1')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - name: Format and tidy
        run: |
          gofmt -w temporaltools agentserver
          go mod tidy
      - name: Commit exact state
        run: |
          rm .github/workflows/a5-1-materialize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add temporaltools agentserver go.mod go.sum
          git add -u .github/workflows/a5-1-materialize.yml
          git commit -m "Materialize A5.1"
          git push
