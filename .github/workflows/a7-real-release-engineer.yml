name: A7 Real Release Engineer E2E

on:
  workflow_dispatch:
  push:
    branches:
      - feature/a7-real-release-engineer-e2e

permissions:
  contents: write
  pull-requests: write

jobs:
  real-github-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      A7_REAL_GITHUB: "1"
      A7_GITHUB_TOKEN: ${{ github.token }}
      A7_OWNER: ${{ github.repository_owner }}
      A7_REPO: ${{ github.event.repository.name }}
      A7_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false

      - name: Run real GitHub lost-ACK takeover proof
        run: go test -race ./integration/a7 -run '^TestRealGitHubReleaseEngineerLostAckTakeover$' -v
