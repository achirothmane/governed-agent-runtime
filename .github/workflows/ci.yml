name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: governed_agent_runtime
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d governed_agent_runtime"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/governed_agent_runtime?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false

      - name: Format A7 candidate via scoped branch lease
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/a7-converged-live-model'
        run: |
          gofmt -w reasoners/openairesponses/native.go reasoners/openairesponses/native_test.go integration/a7_live/live_model_test.go
          if ! git diff --quiet -- reasoners/openairesponses/native.go reasoners/openairesponses/native_test.go integration/a7_live/live_model_test.go; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add reasoners/openairesponses/native.go reasoners/openairesponses/native_test.go integration/a7_live/live_model_test.go
            git commit -m "A7.1: gofmt native reasoner"
            git push origin HEAD:feat/a7-converged-live-model
          fi

      - name: Verify module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum


      - name: Format check
        run: |
          test -z "$(gofmt -l .)"

      - name: Test
        run: go test -race ./...

