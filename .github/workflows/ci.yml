name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: governed_agent_runtime
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d governed_agent_runtime"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/governed_agent_runtime?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false

      - name: Resolve dependencies
        run: |
          go mod tidy
          echo "__GO_MOD_BEGIN__"
          cat go.mod
          echo "__GO_MOD_END__"
          echo "__GO_SUM_BEGIN__"
          cat go.sum
          echo "__GO_SUM_END__"

      - name: Format check
        run: |
          test -z "$(gofmt -l .)"

      - name: Test
        run: go test ./...
