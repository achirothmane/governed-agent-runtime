name: Pin A7 OpenAI SDK

on:
  push:
    branches: [feat/openai-reasoner-a7]

permissions:
  contents: write

jobs:
  pin:
    if: "github.event.head_commit.message != 'Pin A7 OpenAI SDK exact state'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - name: Pin, format, tidy, test
        run: |
          go get github.com/openai/openai-go/v3@v3.73.0
          gofmt -w agentloop sdk mcptransport reasoners/openairesponses temporalagent
          go mod tidy
          go test ./...
      - name: Commit exact dependency state
        run: |
          rm .github/workflows/a7-pin-sdk.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agentloop sdk mcptransport reasoners/openairesponses temporalagent go.mod go.sum
          git add -u .github/workflows/a7-pin-sdk.yml
          git commit -m "Pin A7 OpenAI SDK exact state"
          git push
