name: Materialize A7 Clean

on:
  push:
    branches: [feat/openai-responses-a7]

permissions:
  contents: write

jobs:
  materialize:
    if: "!contains(github.event.head_commit.message, 'Materialize A7 clean')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - name: Pin SDK, format, tidy, test
        run: |
          go get github.com/openai/openai-go/v3@v3.71.2
          gofmt -w agentloop sdk mcptransport reasoners/openairesponses temporalagent
          go mod tidy
          go test ./...
      - name: Commit exact state
        run: |
          rm .github/workflows/a7-clean-materialize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agentloop sdk mcptransport reasoners/openairesponses temporalagent go.mod go.sum
          git add -u .github/workflows/a7-clean-materialize.yml
          git commit -m "Materialize A7 clean"
          git push
