name: Format A5.1

on:
  push:
    branches: [feat/temporal-tool-activity-a5-1]

permissions:
  contents: write

jobs:
  format:
    if: "!contains(github.event.head_commit.message, 'Apply gofmt to A5.1')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format
        run: |
          gofmt -w temporaltools/*.go
          gofmt -w agentserver/postgres_tool_invocations.go
          gofmt -w agentserver/postgres_tool_invocations_test.go
          gofmt -w agentserver/temporal_tool_evidence.go
          gofmt -w agentserver/tools.go
          gofmt -w agentserver/tools_durable_test.go
          gofmt -w agentserver/types.go
          gofmt -w agentserver/server.go
      - name: Commit format
        run: |
          rm .github/workflows/a5-1-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add temporaltools agentserver
          git add -u .github/workflows/a5-1-format.yml
          git commit -m "Apply gofmt to A5.1"
          git push
