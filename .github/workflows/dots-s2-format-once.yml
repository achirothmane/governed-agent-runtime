name: Temporary S2 Go Format
on:
  push:
    branches: [eval/dots-s2-local-llm-groundtruth]
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'achirothmane/governed-agent-runtime'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - name: Format only new S2 Go source on feature branch
        run: |
          test "$(git branch --show-current)" = "eval/dots-s2-local-llm-groundtruth"
          gofmt -w dotproviders/ollama/reasoner.go dotproviders/ollama/reasoner_test.go integration/dotsrealcontext/local_llm_test.go
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- dotproviders/ollama/reasoner.go dotproviders/ollama/reasoner_test.go integration/dotsrealcontext/local_llm_test.go
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(dots s2): gofmt isolated local model evaluator"
          git push origin HEAD:eval/dots-s2-local-llm-groundtruth
