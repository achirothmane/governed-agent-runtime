name: A7 Responses Adapter Contract

on:
  pull_request:
    paths:
      - "reasoners/openairesponses/**"
      - "integration/a7/**"
      - "mcptransport/**"
      - "sdk/**"
      - "temporalagent/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/a7-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-mcp-temporal:
    runs-on: ubuntu-latest
    timeout-minutes: 18

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: governed_agent_runtime
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d governed_agent_runtime"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/governed_agent_runtime?sslmode=disable
      DATA_ENGINE_MCP_URL: http://127.0.0.1:8090/mcp

    steps:
      - name: Checkout runtime pull request
        uses: actions/checkout@v4

      - name: Checkout public Data Engine
        uses: actions/checkout@v4
        with:
          repository: achirothmane/data-engine
          ref: main
          path: _integration/data-engine

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false

      - name: Start actual Data Engine MCP
        working-directory: _integration/data-engine
        run: |
          nohup go run ./cmd/dataengine-mcp --addr 127.0.0.1:8090 >/tmp/a7-data-engine-mcp.log 2>&1 &
          echo $! >/tmp/a7-data-engine-mcp.pid
          for i in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:8090/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/a7-data-engine-mcp.log
          exit 1

      - name: Real PostgreSQL and Temporal with OpenAI SDK protocol
        run: |
          go test -tags=integration -run TestOpenAIAdapterDrivesDurableDataEngineLoop -count=1 -v ./integration/a7

      - name: Show Data Engine logs on failure
        if: failure()
        run: cat /tmp/a7-data-engine-mcp.log || true
