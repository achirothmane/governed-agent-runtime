name: Materialize A7

on:
  push:
    branches: [feat/openai-reasoner-a7]

permissions:
  contents: write

jobs:
  materialize:
    if: "!contains(github.event.head_commit.message, 'Materialize A7')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - name: Add current OpenAI Go SDK, format, tidy, test
        run: |
          go get github.com/openai/openai-go/v3@v3.71.2
          gofmt -w sdk mcptransport reasoners/openai
          go mod tidy
          go test ./...
      - name: Commit exact state
        run: |
          rm .github/workflows/a7-materialize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sdk mcptransport reasoners/openai go.mod go.sum
          git add -u .github/workflows/a7-materialize.yml
          git commit -m "Materialize A7"
          git push
