name: Materialize A6.1

on:
  push:
    branches: [feat/durable-agent-a6-1]

permissions:
  contents: write

jobs:
  materialize:
    if: "!contains(github.event.head_commit.message, 'Materialize A6.1')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - name: Format and tidy
        run: |
          gofmt -w agentloop temporaltools temporalagent agentserver integration/a6_1
          go mod tidy
      - name: Compile and unit test
        run: go test ./...
      - name: Commit exact state
        run: |
          rm .github/workflows/a6-1-materialize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agentloop temporaltools temporalagent agentserver integration/a6_1 go.mod go.sum
          git add -u .github/workflows/a6-1-materialize.yml
          git commit -m "Materialize A6.1"
          git push
