name: Materialize A5 runtime

on:
  push:
    branches: [feat/data-engine-a5]

permissions:
  contents: write

jobs:
  materialize:
    if: "!contains(github.event.head_commit.message, 'Materialize A5 runtime')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - name: Format and tidy
        run: |
          gofmt -w sdk agentserver integrations/dataengine
          go mod tidy
      - name: Commit exact source/module state
        run: |
          rm .github/workflows/a5-materialize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sdk agentserver integrations/dataengine go.mod go.sum
          git add -u .github/workflows/a5-materialize.yml
          git commit -m "Materialize A5 runtime"
          git push
