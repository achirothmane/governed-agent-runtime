name: Materialize A4 sources

on:
  push:
    branches: [feat/agent-server-a4]

permissions:
  contents: write

jobs:
  materialize:
    if: "!contains(github.event.head_commit.message, 'Materialize exact A4 sources')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand exact sources
        run: |
          gzip -dc agentserver/server.go.gz > agentserver/server.go
          gzip -dc agentserver/memory.go.gz > agentserver/memory.go
          rm agentserver/server.go.gz agentserver/memory.go.gz
          rm .github/workflows/a4-materialize.yml
      - name: Commit materialized sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agentserver/server.go agentserver/memory.go .github/workflows/a4-materialize.yml
          git add -u agentserver/server.go.gz agentserver/memory.go.gz
          git commit -m "Materialize exact A4 sources"
          git push
