name: Check A6.1 Compact Ledger

on:
  push:
    branches: [feat/durable-agent-a6-1]

permissions:
  contents: write

jobs:
  check:
    if: "!contains(github.event.head_commit.message, 'Materialize compact A6.1')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - name: Format, tidy, test
        run: |
          gofmt -w temporalagent agentserver temporaltools
          go mod tidy
          go test ./...
      - name: Commit exact state
        run: |
          rm .github/workflows/a6-1-compact-check.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add temporalagent agentserver temporaltools go.mod go.sum
          git add -u .github/workflows/a6-1-compact-check.yml
          git commit -m "Materialize compact A6.1"
          git push
