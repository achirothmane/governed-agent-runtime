name: Format A4.1

on:
  push:
    branches: [feat/agent-server-postgres-a4-1]

permissions:
  contents: write

jobs:
  format:
    if: "!contains(github.event.head_commit.message, 'Apply gofmt to A4.1')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format
        run: gofmt -w agentserver/postgres.go agentserver/postgres_test.go
      - name: Commit format
        run: |
          rm .github/workflows/a4-1-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agentserver/postgres.go agentserver/postgres_test.go
          git add -u .github/workflows/a4-1-format.yml
          git commit -m "Apply gofmt to A4.1"
          git push
