name: A7.1 Tool Choice Counterfactual Controls

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  counterfactual:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feat/a7-converged-live-model'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      A7_PROBE_MODEL: qwen3:1.7b
    steps:
      - uses: actions/checkout@v4
      - name: Start loopback Ollama
        run: |
          docker run --rm -d --name a7-control \
            -p 127.0.0.1:11434:11434 ollama/ollama:0.13.3
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Pull tool-capable Qwen3
        run: docker exec a7-control ollama pull "$A7_PROBE_MODEL"
      - name: Test required forced and none against contrary user requests
        run: |
          python3 scripts/a7_choice_negative_controls.py \
            --base-url http://127.0.0.1:11434/v1 \
            --model "$A7_PROBE_MODEL" \
            --output a7-tool-choice-counterfactual.json
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a7-choice-negative-controls
          path: a7-tool-choice-counterfactual.json
          if-no-files-found: ignore
      - name: Stop Ollama
        if: always()
        run: docker stop a7-control || true
