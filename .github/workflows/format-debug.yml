name: Format debug

on:
  push:
    branches:
      - feature/release-engineer-github-effect-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - name: Show gofmt diff
        run: |
          gofmt -w internal/runtime/reconciliation*.go internal/runtime/postgres_store.go internal/releaseengineer/*.go
          git diff -- internal/runtime/reconciliation*.go internal/runtime/postgres_store.go internal/releaseengineer/*.go
          test -z "$(git status --short -- internal/runtime/reconciliation*.go internal/runtime/postgres_store.go internal/releaseengineer/*.go)"
