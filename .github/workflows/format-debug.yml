name: Format debug

on:
  push:
    branches:
      - feature/release-engineer-github-effect-v1

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - name: Show gofmt diff
        run: |
          gofmt -w .
          git diff -- '*.go'
          test -z "$(git status --short -- '*.go')"
