name: Capture A3 module files

on:
  push:
    branches: [feat/mcp-transport-a3]

permissions:
  contents: write

jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - name: Tidy module
        run: go mod tidy
      - name: Commit exact module files
        run: |
          if git diff --quiet -- go.mod go.sum; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum
          git commit -m "Resolve MCP A3 module dependencies"
          git push
