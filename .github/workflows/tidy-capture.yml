name: Capture module files

on:
  push:
    branches: [feat/temporal-backend-a2]

permissions:
  contents: read

jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - name: Tidy module
        run: go mod tidy
      - name: Upload module files
        uses: actions/upload-artifact@v4
        with:
          name: temporal-a2-module-files
          path: |
            go.mod
            go.sum
